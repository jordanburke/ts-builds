minimumReleaseAgeExclude:
  # First-party packages we publish ourselves — the cooldown adds no
  # supply-chain value here, and version pins re-trip on every release.
  # A name glob covers functype, functype-os, eslint-{config,plugin}-functype
  # at all current and future versions.
  - "*functype*"
  # Third-party deps stay subject to the cooldown — pin a specific
  # pkg@version here only if a fresh release blocks a needed lockfile resolution.
  - "@vitest/*"

overrides:
  unrun: "0.2.37"
  # Dependabot alert 3: GHSA-g3hv-75wg-m249, minimatch >=7.0.0 <11.0.1 (DoS via globparts amplification),
  # reached via ESLint 10 (^10.2.6), @eslint/config-array and typescript-eslint's parser. No patched 10.x
  # exists. The full validate passes with ESLint on 11.0.5. glob 13 (via rimraf) also lists minimatch 10, but
  # its published bundle inlines its own copy, so this override doesn't change what glob runs. This only
  # changes ts-builds' own install: pnpm overrides don't reach consumers. Drop once ESLint's floor is >=11.0.1.
  "minimatch@>=7.0.0 <11.0.1": "^11.0.1"

peerDependencyRules:
  allowedVersions:
    eslint: "10"

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*vitest*"
  - "typescript"
  - "*rimraf*"
  - "*cross-env*"
