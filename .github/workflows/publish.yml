name: Publish to NPM

on:
  push:
    tags:
      - "v*" # Trigger on version tags (v1.0.0, v1.2.3, etc.)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write # Required for GitHub release
      id-token: write # Required for npm provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # A prerelease such as 4.6.0-next.0 publishes to the `next` dist-tag and never
      # moves `latest`. npm refuses a prerelease without --tag, and a mismatched tag
      # would publish package.json's version, so both are checked before anything runs.
      # A stable version passes no --tag: npm then applies `latest` itself, and keeps
      # its guard against moving `latest` back to a lower version (a backport).
      - name: Pick the npm dist-tag
        id: dist-tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          release=${version%%+*}
          case "$release" in
            *-*)
              prerelease=${release#*-}
              tag=${prerelease%%.*}
              case "$tag" in
                "" | latest | x | *[!a-z]*)
                  echo "::error::Prerelease $version needs a lowercase word as its first identifier, such as ${release%%-*}-next.0. That word becomes the npm dist-tag, so it can't be latest or x"
                  exit 1
                  ;;
              esac
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "Publishing $version to dist-tag $tag"
              ;;
            *)
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "Publishing $version to latest"
              ;;
          esac

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap and check
        run: pnpm ci:bootstrap

      - name: Verify package contents
        run: |
          echo "Files to be published:"
          npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public ${DIST_TAG:+--tag "$DIST_TAG"}
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ steps.dist-tag.outputs.tag != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
