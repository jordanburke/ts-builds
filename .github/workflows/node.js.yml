# Validate that the configs package can be packed and published
name: Validate Configs Package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `ci`, not `validate`: the same chain with format and lint as checks, so CI never rewrites the tree.
      - name: Validate package (check only)
        run: pnpm ci:bootstrap
        # Dogfood ts-builds' own lint telemetry: per-rule and per-message counts, plus
        # the trace (this public repo's name, the commit, each finding's file and line),
        # never source. Node 24 only, so each commit is counted once, not per matrix leg.
        # Receiver: https://github.com/jordanburke/lint-telemetry
        env:
          TS_BUILDS_TELEMETRY: ${{ matrix.node-version == '24.x' && '1' || '' }}
          TS_BUILDS_TELEMETRY_URL: https://otel.tsnpm.com/v1/lint
          TS_BUILDS_TELEMETRY_TRACE: "1"

      - name: Test npm pack
        run: |
          echo "Testing package creation..."
          npm pack --dry-run
          echo "✓ Package can be created successfully"

      - name: Verify package contents
        run: |
          echo "Files that would be published:"
          npm pack --dry-run | grep -v "npm notice"
